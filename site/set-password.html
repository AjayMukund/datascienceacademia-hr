<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose Password · HR & Attendance</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/hr.css">
</head>
<body>
<div class="auth">
  <div class="auth-card">
    <div class="brand"><b>Data Science Academia</b><span>HR &amp; Attendance</span></div>
    <h1>Choose a password</h1>
    <p class="lead" id="lead">Checking your link…</p>
    <form id="f" class="hidden">
      <div id="msg" class="msg err hidden"></div>
      <label class="f">New password <input type="password" id="pw" minlength="8" required autocomplete="new-password"></label>
      <label class="f">Repeat it <input type="password" id="pw2" minlength="8" required autocomplete="new-password"></label>
      <button class="gold" id="btn">Save and continue</button>
    </form>
    <p class="auth-foot"><a href="index.html">← Back to sign in</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/hr.js"></script>
<script>
(async () => {
  // supabase-js reads the token from the link (#access_token=… or ?code=…) and starts a session.
  let session = null;
  for (let i = 0; i < 10 && !session; i++) {
    session = (await supa.auth.getSession()).data.session;
    if (!session) await new Promise(r => setTimeout(r, 300));
  }
  if (!session) {
    $("lead").innerHTML = 'This link has expired or was already used. <a href="forgot.html">Request a new one</a>.';
    return;
  }
  $("lead").textContent = `For ${session.user.email}. At least 8 characters.`;
  $("f").classList.remove("hidden");
})();
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("msg");
  if ($("pw").value !== $("pw2").value) { m.textContent = "The two passwords don't match."; m.classList.remove("hidden"); return; }
  $("btn").disabled = true;
  const { error } = await supa.auth.updateUser({ password: $("pw").value });
  if (error) { m.textContent = error.message; m.classList.remove("hidden"); $("btn").disabled = false; return; }
  location.replace("dashboard.html");
});
</script>
</body>
</html>
